<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UjianKu Offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0f172a; color: #fff; }
        main { max-width: 24rem; padding: 2rem; text-align: center; }
        button { margin-top: 1rem; min-height: 44px; border: 0; border-radius: 0.75rem; padding: 0.75rem 1rem; background: #2563eb; color: #fff; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>Koneksi terputus</h1>
        <p>Jawaban yang sudah disimpan akan dikirim ulang saat koneksi kembali.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
